<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contactos Comerciales Construcción</title>
<meta name="description" content="Agenda personal de contactos comerciales de construcción: escanea tarjetas de visita y búscalas por nombre, apellido o empresa.">
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Una columna de móvil: cabecera fija con buscador y micrófono, lista de fichas desplegables, botón de escanear abajo. */
:root {
  --bg: #eceff2; --surface: #ffffff; --ink: #14213d; --muted: #566274; --line: #d3d9e0;
  --accent: #c2410c; --on-accent: #ffffff; --tint: #dfe6f0; --danger: #b42318; --ok: #146c43;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e1520; --surface: #172131; --ink: #e8ecf2; --muted: #9aa7b8; --line: #2a3748;
    --accent: #f97316; --on-accent: #1d0e04; --tint: #22304a; --danger: #ff8a80; --ok: #6fd3a0; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.4;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
button, input, textarea { font: inherit; color: inherit; }
button, label.btn { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app { max-width: 640px; margin-inline: auto; padding-inline: 16px; padding-bottom: 120px; }
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-block: 14px 12px; border-bottom: 2px dashed var(--accent); }
.titlebar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.55rem; letter-spacing: .02em; text-transform: uppercase; line-height: 1.05; text-wrap: balance; }
.count { margin: 2px 0 10px; color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
.iconbtn { flex: none; width: 46px; height: 46px; display: grid; place-items: center; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); }
.iconbtn svg { width: 22px; height: 22px; }
.iconbtn.live { border-color: var(--accent); color: var(--accent); }
.searchrow { display: flex; gap: 8px; }
.search { flex: 1; min-width: 0; padding: 13px 14px; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 1.05rem; }
.search:focus { border-color: var(--accent); outline: none; }
.banner { margin-top: 12px; padding: 12px 14px; border-radius: 8px; background: var(--tint); font-size: .95rem; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.banner .btn { padding: 7px 12px; font-size: .9rem; }

.list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.head { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px; background: none; border: 0; text-align: left; }
.avatar { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--tint); font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; }
.who { min-width: 0; }
.name { font-weight: 600; font-size: 1.08rem; overflow-wrap: anywhere; }
.sub { color: var(--muted); font-size: .92rem; overflow-wrap: anywhere; }
.detail { padding: 4px 14px 14px; border-top: 1px solid var(--line); }
.quick { display: flex; flex-wrap: wrap; gap: 8px; padding-block: 10px 6px; }
.quick a, .quick button { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px; background: var(--tint); border: 0; color: var(--ink); text-decoration: none; font-weight: 600; font-size: .95rem; }
.row { display: grid; grid-template-columns: 6.4rem minmax(0, 1fr) auto; gap: 8px; align-items: start; padding-block: 9px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row dt { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; padding-top: 3px; }
.row dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.mini { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; font-size: .82rem; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.date { margin: 10px 0 0; color: var(--muted); font-size: .82rem; }
mark { background: color-mix(in srgb, var(--accent) 28%, transparent); color: inherit; border-radius: 2px; }

.btn { display: inline-block; border: 2px solid var(--ink); background: none; border-radius: 10px; padding: 11px 18px; font-weight: 600; text-align: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn.big { position: relative; overflow: hidden; display: block; width: 100%; padding: 16px 18px; font-size: 1.08rem; text-align: left; }
.pick { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.empty { margin-top: 28px; padding: 24px 18px; border: 2px dashed var(--line); border-radius: 12px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-family: var(--font-display); font-size: 1.5rem; margin-bottom: 4px; }

.fab { position: fixed; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 6; display: flex; align-items: center; gap: 10px;
  background: var(--accent); color: var(--on-accent); border: 0; border-radius: 999px; padding: 17px 24px; font-weight: 600; font-size: 1.08rem; box-shadow: 0 6px 18px rgba(0,0,0,.28); }
.fab svg { width: 24px; height: 24px; }

.layer { position: fixed; inset: 0; z-index: 20; overflow-y: auto; background: var(--bg); padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
.layer.dim { background: rgba(8, 14, 24, .62); display: flex; align-items: flex-end; }
.panel { width: 100%; max-width: 640px; margin-inline: auto; padding: 18px 16px 24px; }
.dim .panel { background: var(--surface); border-radius: 16px 16px 0 0; display: flex; flex-direction: column; gap: 10px; }
.panel h2 { margin: 0 0 4px; font-family: var(--font-display); font-size: 1.7rem; text-transform: uppercase; letter-spacing: .02em; }
.panel p { margin: 0; color: var(--muted); }
.form { display: grid; gap: 12px; margin-top: 12px; }
.field label { display: block; margin-bottom: 4px; color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; }
.field input, .field textarea { width: 100%; padding: 12px 14px; border: 2px solid var(--line); border-radius: 8px; background: var(--surface); }
.field input:focus, .field textarea:focus { border-color: var(--accent); outline: none; }
.field.check input { border-color: var(--accent); }
.field .hint { display: block; margin-top: 3px; font-size: .82rem; color: var(--accent); }
.field textarea { min-height: 88px; resize: vertical; }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.bar { position: sticky; bottom: 0; display: flex; gap: 10px; padding-block: 12px; margin-top: 14px; background: var(--bg); }
.bar .btn { flex: 1; }
.warn { margin-top: 12px; padding: 12px 14px; border-radius: 8px; background: var(--tint); border-left: 5px solid var(--accent); font-size: .95rem; }
.photo { display: block; max-width: 100%; max-height: 180px; margin: 10px 0 2px; border-radius: 8px; border: 1px solid var(--line); }
details.raw { margin-top: 12px; color: var(--muted); font-size: .9rem; }
details.raw pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: .85rem; color: var(--ink); }
.progress { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.menu-item { text-align: left; }
.tip { padding: 10px 12px; border-radius: 8px; background: var(--tint); color: var(--ink) !important; font-size: .95rem; }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; max-width: calc(100% - 32px);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: .95rem; }
@media (prefers-reduced-motion: reduce) { .progress i { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="titlebar">
      <h1>Contactos Comerciales Construcción</h1>
      <button class="iconbtn" id="more" type="button" aria-label="Copia de seguridad y opciones">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
      </button>
    </div>
    <p class="count" id="count">&nbsp;</p>
    <div class="searchrow">
      <input id="q" class="search" type="search" placeholder="Nombre, apellido o empresa" autocomplete="off" aria-label="Buscar contacto">
      <button class="iconbtn" id="mic" type="button" aria-label="Buscar por voz" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="list" class="list" aria-live="polite"></main>
</div>

<button class="fab" id="add" type="button">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
  Añadir tarjeta
</button>

<div id="addmenu" class="layer dim" hidden role="dialog" aria-modal="true" aria-label="Añadir contacto">
  <div class="panel">
    <h2>Nuevo contacto</h2>
    <p class="tip">Para que se lea bien: acerca el móvil hasta que la tarjeta ocupe casi toda la foto, con buena luz y sin sombras.</p>
    <label class="btn big primary" for="file-cam">Hacer foto a la tarjeta<input id="file-cam" class="pick" type="file" accept="image/*" capture="environment"></label>
    <label class="btn big" for="file-gal">Elegir foto de la galería<input id="file-gal" class="pick" type="file" accept="image/*"></label>
    <button class="btn big" type="button" id="m-man">Introducir a mano</button>
    <button class="btn" type="button" id="m-close">Cancelar</button>
  </div>
</div>

<div id="optmenu" class="layer dim" hidden role="dialog" aria-modal="true" aria-label="Opciones">
  <div class="panel">
    <h2>Copia de seguridad</h2>
    <p>Tus contactos solo están en este móvil. Guarda una copia de vez en cuando, por ejemplo en Google Drive.</p>
    <button class="btn big primary menu-item" type="button" id="o-export">Guardar copia de seguridad</button>
    <label class="btn big menu-item" for="file-import">Restaurar desde una copia<input id="file-import" class="pick" type="file" accept=".json,application/json"></label>
    <p id="o-last"></p>
    <button class="btn" type="button" id="o-close">Cerrar</button>
  </div>
</div>

<div id="busy" class="layer dim" hidden role="dialog" aria-modal="true" aria-label="Leyendo la tarjeta">
  <div class="panel" id="busy-body"></div>
</div>

<div id="sheet" class="layer" hidden role="dialog" aria-modal="true" aria-label="Ficha de contacto"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="parse.js"></script>
<script src="app.js"></script>
</body>
</html>
